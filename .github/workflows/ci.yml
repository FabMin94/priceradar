name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter
        run: uv run format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: priceradar
          POSTGRES_PASSWORD: priceradar_pass
          POSTGRES_DB: priceradar_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U priceradar -d priceradar_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen
      
      - name: Create test database
        env:
          PGPASSWORD: priceradar_pass
        run: psql -h localhost -p 5433 -U priceradar -d priceradar_db -c "CREATE DATABASE priceradar_test_db;"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://priceradar:priceradar_pass@localhost:5433/priceradar_db
          TEST_DATABASE_URL: postgresql+asyncpg://priceradar:priceradar_pass@localhost:5433/priceradar_test_db
          AUTHKIT_URL: http://localhost:8000
        run: uv run pytest -v

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6  

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
    
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:latest