services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: priceradar
      POSTGRES_PASSWORD: priceradar_pass
      POSTGRES_DB: priceradar_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priceradar -d priceradar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
