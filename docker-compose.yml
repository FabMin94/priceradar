services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: priceradar
      POSTGRES_PASSWORD: priceradar_pass
      POSTGRES_DB: priceradar_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priceradar -d priceradar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://priceradar:priceradar_pass@db:5432/priceradar_db
      AUTHKIT_URL: http://host.docker.internal:8000
    depends_on:
      db:
        condition: service_healthy    

volumes:
  postgres_data:
